# Electron reuses the Web product composition without its HTTP-only rows.

- id: web-startup
  disabled: true

- id: webserver
  disabled: true

- id: web-runtime
  disabled: true

- id: client-hmr
  disabled: true

- id: connection
  inject: []
  config:
    trustedHosts: []

# The operator is always seated at the Electron host, so the native chooser
# and its client surface replace the Web deployment probe.
- id: directory-picker
  disabled: true

- insert:
    - id: directory-picker-native
      name: '@deepseek-ai/dsh-host-directory-picker-native'

    - id: ui-directory-picker-native
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'
